services:
  - type: web
    name: invivodb-web
    runtime: python
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      cd src/web && python -c "from app import app, db; app.app_context().push(); db.create_all()"
    startCommand: cd src/web && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///instance/invivodb.db
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: src/web/app.py
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PIP_PREFER_BINARY
        value: "1"
      - key: PIP_ONLY_BINARY
        value: "all"
    disk:
      name: invivodb-disk
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
