{% extends "base.html" %}

{% block title %}Page Not Found - InvivoDB{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="error-content">
                    <h1 class="error-code">404</h1>
                    <h2 class="error-message">Page Not Found</h2>
                    <p class="error-description">
                        The page you're looking for doesn't exist or has been moved.
                    </p>
                    <div class="error-actions">
                        <a href="{{ url_for('landing') }}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Go Home
                        </a>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="{{ url_for('experiments') }}" class="btn btn-outline-primary">
                            <i class="fas fa-flask"></i> Browse Experiments
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 60px 0;
    min-height: 60vh;
    display: flex;
    align-items: center;
}

.error-content {
    padding: 40px;
}

.error-code {
    font-size: 8rem;
    font-weight: bold;
    color: #6c757d;
    margin-bottom: 0;
    line-height: 1;
}

.error-message {
    font-size: 2.5rem;
    color: #343a40;
    margin-bottom: 20px;
}

.error-description {
    font-size: 1.2rem;
    color: #6c757d;
    margin-bottom: 40px;
}

.error-actions .btn {
    margin: 5px;
    padding: 12px 24px;
}
</style>
{% endblock %}
